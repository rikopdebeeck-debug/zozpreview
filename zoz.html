<!DOCTYPE html>
<html>
    <head>
        <title>My Page</title>
        <style>
            body {
                font-family: Verdana;
                background-color: #f0f0f0;
                min-height: 100vh;
                height: 100vh;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .heading {
                position: absolute;
                top: 1vh;
                left: 0;
                width: 100%;
                text-align: center;
            }
            .heading h1 {
                margin: 0 0 4px;
            }
            .heading p {
                margin: 0;
            }
            .container {
                box-sizing: border-box;
                width: 90vw;
                height: 80vh;
                padding: 20px;
                background-color: #ffffff;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                border-radius: 15px;
                position: relative;
            }
            .container iframe {
                display: block;
                width: 100%;
                height: 100%;
                border: none;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
     <header class="heading">
        <h1>Zicht op Zenith</h1>
        <p>septembereditie 2026</p>
     </header>
     <div class="container">
        <iframe src="https://madmagz.app/viewer/6aa98380d001960013f0be44?type=embed&pageMode=double" width="600" height="424" scrolling="no" frameborder="0" allowfullscreen></iframe>
     </div>
    </body>
</html>
